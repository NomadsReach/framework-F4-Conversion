name: Desktop static guards

on:
  pull_request:
  push:
    branches:
      - main
      - fix/scaleform-focus-lifecycle

jobs:
  static-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/static_guards.py
